[project]
name = "mini-shop-admin-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.0",
    "uvicorn==0.30.6",
    "SQLAlchemy==2.0.35",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "pwdlib[argon2]==0.2.1",
]

[project.optional-dependencies]
test = [
    "pytest==8.3.3",
    "httpx==0.27.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
